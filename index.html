    <!-- 404.html 重定向回填：必须早于 main.ts 执行 -->
    <script>
      (function () {
        var l = window.location;
        if (l.search.indexOf('?p=/') === 0 || l.search.indexOf('&p=/') !== -1) {
          var u = new URL(l.href);
          var p = u.searchParams.get('p');
          var q = u.searchParams.get('q');
          u.searchParams.delete('p');
          u.searchParams.delete('q');
          var hash = u.hash || '';
          var newUrl = l.pathname.replace(/\/$/, '') + p + (q ? '?' + q : '') + hash;
          window.history.replaceState(null, '', newUrl);
        }
      })();
    </script>

    <!--
      PWA 一次性自愈：把 KEY 从 v3 → v4，强制还在 v3 之后到现在没再清理过的旧客户端
      再卸一次 SW + 清 caches + reload。这个脚本需要在新 SW 注册之前执行，所以放在
      <head> 里（无 defer），但只调 unregister/caches，不阻塞 HTML 解析（异步）。

      之后的版本迭代由 vite-plugin-pwa 的 prompt 流程接管：检测到新版本 → 弹 toast →
      用户点「立即更新」→ skipWaiting + reload。除非再出现"老 SW 行为不可控"的紧急情况，
      否则不再 bump KEY。
    -->
    <script>
      (function () {
        if (!('serviceWorker' in navigator)) return;
        var KEY = 'kap-sw-cleanup-v4';
        if (localStorage.getItem(KEY)) return;
        navigator.serviceWorker
          .getRegistrations()
          .then(function (regs) {
            var hadOld = regs.length > 0;
            return Promise.all(
              regs.map(function (r) {
                return r.unregister();
              }),
            ).then(function () {
              if (window.caches && caches.keys) {
                return caches.keys().then(function (keys) {
                  return Promise.all(
                    keys.map(function (k) {
                      return caches.delete(k);
                    }),
                  );
                }).then(function () {
                  return hadOld;
                });
              }
              return hadOld;
            });
          })
          .then(function (hadOld) {
            localStorage.setItem(KEY, '1');
            if (hadOld) {
              var u = new URL(location.href);
              u.searchParams.set('_v', String(Date.now()));
              location.replace(u.toString());
            }
          });
      })();
    </script>
