    <title>KAP - 前端知识自查</title>
    <script>
      (function () {
        if ('serviceWorker' in navigator) {
          var KEY = 'kap-sw-cleanup-v2';
          if (!localStorage.getItem(KEY)) {
            navigator.serviceWorker.getRegistrations().then(function (regs) {
              var hadOld = regs.length > 0;
              return Promise.all(regs.map(function (r) { return r.unregister(); })).then(function () {
                if (window.caches && caches.keys) {
                  return caches.keys().then(function (keys) {
                    return Promise.all(keys.map(function (k) { return caches.delete(k); }));
                  }).then(function () { return hadOld; });
                }
                return hadOld;
              });
            }).then(function (hadOld) {
              localStorage.setItem(KEY, '1');
              if (hadOld) location.reload();
            });
          }
        }
      })();
    </script>
    <script>
      (function () {
        var l = window.location;
        if (l.search.indexOf('?p=/') === 0 || l.search.indexOf('&p=/') !== -1) {
          var u = new URL(l.href);
          var p = u.searchParams.get('p');
          var q = u.searchParams.get('q');
          u.searchParams.delete('p');
          u.searchParams.delete('q');
          var hash = u.hash || '';
          var newUrl = l.pathname.replace(/\/$/, '') + p + (q ? '?' + q : '') + hash;
          window.history.replaceState(null, '', newUrl);
        }
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
